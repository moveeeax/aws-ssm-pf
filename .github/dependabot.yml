version: 2
updates:
  # The AWS SDK is the whole trust boundary for credential resolution here, so
  # it should not silently rot.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      aws-sdk:
        patterns:
          - "github.com/aws/*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
